semanticsearch.application-context=semanticsearch-spring.xml
# local Ollama server, for embeddings and/or the RAG answer model (ollama pull <model> first).
# Nothing connects at startup.
semanticsearch.ollama.url=http://localhost:11434
semanticsearch.answer.ollama.model=qwen3:8b
semanticsearch.answer.timeout.ms=60000
semanticsearch.answer.context.tokens=4096
semanticsearch.answer.disable.thinking=true
semanticsearch.answer.top.k=8
# Answer cost: the model call is the running cost (docs/decisions.md, "Answer cost").
# output tokens per answer (1 to 3 sentences of JSON need ~150); a cut-off answer falls back to the list
semanticsearch.answer.max.tokens=256
# words of 4+ letters a query needs for an answer; codes and short queries (6204-2RS, SPZ 1250) get the list only
semanticsearch.answer.min.words=2
# repeated questions with the same results reuse the stored answer for a day (per node)
semanticsearch.answer.cache.size=10000
# model calls a day per node (cache hits don't count); above it the list only. 0 = no cap
semanticsearch.answer.max.per.day=5000

# OCC extension: controllers in io.github.emenowicz.semanticsearch.occ join the /occ/v2 web app
ext.semanticsearch.extension.webmodule.webroot=/occ/v2
# OCC maps exceptions to HTTP status by simple class name; ResponseStatusException is ignored (always 400)
webservicescommons.resthandlerexceptionresolver.SemanticSearchUnavailableException.status=503
webservicescommons.resthandlerexceptionresolver.SemanticSearchUnavailableException.messageFormatterType=FORWARD
webservicescommons.resthandlerexceptionresolver.SemanticSearchUnavailableException.logstack=false
webservicescommons.resthandlerexceptionresolver.EmbeddingBudgetExceededException.status=429
webservicescommons.resthandlerexceptionresolver.EmbeddingBudgetExceededException.messageFormatterType=FORWARD
webservicescommons.resthandlerexceptionresolver.EmbeddingBudgetExceededException.logstack=false

# Embedding provider: ollama (local bge-m3, no key, no cost) or voyage (hosted; needs the key below).
# Both give 1024-dim vectors (the knn1024 Solr field). Changing provider: run productEmbeddingCronJob, then a full index.
semanticsearch.embedding.provider=ollama
semanticsearch.embedding.ollama.model=bge-m3
# covers a job batch (100 products x 4 languages) on the local model
semanticsearch.embedding.ollama.timeout.ms=60000
# productEmbeddingJob: the Solr facet search config whose products it embeds, and products per embedding call
semanticsearch.embedding.index=semanticsearchIndex
semanticsearch.embedding.job.batch.size=100

# Voyage AI. Set the key in local.properties (or a Cloud Portal service property), never here.
semanticsearch.voyage.api.key=
semanticsearch.voyage.query.model=voyage-4
semanticsearch.voyage.dimensions=1024
semanticsearch.voyage.timeout.ms=3000
# query side: repeated queries come from memory; API calls a minute per node (cache hits don't count), 429 above
semanticsearch.voyage.query.cache.size=1000
semanticsearch.voyage.query.max.requests.per.minute=300
# indexing embeds a whole indexer batch per request, so it gets a longer timeout
semanticsearch.voyage.document.model=voyage-4-large
semanticsearch.voyage.document.timeout.ms=60000
# texts per request (Voyage max 1000) and attempts on HTTP 429.
# Free tier without a payment method (3 requests, 10K tokens a minute): in local.properties set
# batch.size=40 and min.interval.ms=21000 (one request every 21s).
semanticsearch.voyage.document.batch.size=1000
semanticsearch.voyage.document.max.attempts=5
semanticsearch.voyage.document.min.interval.ms=0

